name: Keep Supabase Alive 🚀

on:
  schedule:
    # Se ejecuta todos los lunes y jueves a las 00:00 UTC (dos veces por semana para asegurar actividad)
    - cron: '0 0 * * 1,4'
  workflow_dispatch: # Permite ejecutarlo manualmente desde la pestaña Actions en GitHub

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping Supabase API
        run: |
          curl -I "https://hpijsgxcjynqtrclkbnq.supabase.co/rest/v1/"
